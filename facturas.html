<!DOCTYPE html>
<!-- Vista de consulta de facturas generadas por las ventas. -->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Facturas</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="./styles/bootstrap-theme.css">
</head>
<body data-module="facturas" class="bg-light">
    <nav class="navbar navbar-dark bg-success px-4 py-3 shadow">
        <strong class="navbar-brand">Farmacia Josue</strong>
        <span id="sessionUser" class="text-white"></span>
        <button
            id="logoutButton"
            class="btn btn-outline-light"
            type="button"
        >
            Cerrar sesión 
        </button>
    </nav>

    <main class="container-fluid p-4">
        <button
            id="backButton"
            class="btn btn-outline-success mb-3"
            type="button"
        >
            ← Volver al menú
        </button>

        <h1 id="pageTitle"></h1>
        <p id="pageDescription" class="text-secondary"></p>
        <div id="message" class="alert d-none" role="alert"></div>

        <section class="card border-0 rounded-4 shadow-sm table-responsive">
            <div id="tableContainer"></div>
        </section>
    </main>

    <script src="./tabla.js"></script>
</body>
</html>
